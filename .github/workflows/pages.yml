name: Deploy Web to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Godot + templates
        run: bash tools/ci_setup_godot.sh

      - name: Import project
        working-directory: godot
        run: |
          "$GODOT_BIN" --headless --import || true
          "$GODOT_BIN" --headless --editor --quit || true

      - name: Export Web
        working-directory: godot
        run: |
          mkdir -p ../public
          "$GODOT_BIN" --headless --export-release "Web" ../public/index.html
          ls -la ../public
          # fail loudly rather than publish a blank canvas
          test -s ../public/index.wasm
          test -s ../public/index.pck
          test -s ../public/index.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
