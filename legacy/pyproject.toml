[project]
name = "card-corner"
version = "0.1.0"
description = "A kid-friendly card game suite: Go Fish, Old Maid, Memory, and Letter Match"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pygame>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# Optional. Only needed for tools/build_assets.py, a stand-alone helper
# that rasterizes SVGs in assets/source/ into ui/assets/ PNGs. It is NOT
# part of any normal flow: the game, run.sh, and the .deb build all just
# load the PNG/JPG art committed directly under ui/assets/. Kept for
# anyone who prefers to keep .svg sources and batch-convert them.
assets = [
    "cairosvg>=2.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "games*", "ui*", "audio*"]

[tool.setuptools]
py-modules = ["main", "version"]

[tool.setuptools.package-data]
# The real art the game loads (see assets/design.md) -- setuptools
# excludes non-.py files by default, so this needs an explicit declaration
# or a `pip install .` (as opposed to the .deb's raw directory copy) would
# silently ship without any of it.
"ui.assets" = ["**/*.png", "**/*.jpg", "**/*.jpeg"]
