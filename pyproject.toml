[project]
name = "card-corner"
version = "0.1.0"
description = "A kid-friendly card game suite: Go Fish, Old Maid, Memory, and Letter Match"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pygame>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# Only needed to run tools/build_assets.py (converting artist-supplied
# assets/source/*.svg into the ui/assets/*.png the game actually loads).
# The shipped app and .deb never depend on this -- it only ever loads
# already-generated PNGs. A key sourced from a .png instead of .svg never
# needs this either.
assets = [
    "cairosvg>=2.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "games*", "ui*", "audio*"]

[tool.setuptools]
py-modules = ["main", "version"]

[tool.setuptools.package-data]
# Generated art (assets/design.md, tools/build_assets.py) -- setuptools
# excludes non-.py files by default, so this needs an explicit declaration
# or a `pip install .` (as opposed to the .deb's raw directory copy) would
# silently ship without any of it.
"ui.assets" = ["**/*.png"]
