[project]
name = "card-corner"
version = "0.1.0"
description = "A kid-friendly card game suite: Go Fish, Old Maid, Memory, and Letter Match"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pygame>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "games*", "ui*"]
