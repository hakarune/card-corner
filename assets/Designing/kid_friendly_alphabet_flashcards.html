<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kid-Friendly Alphabet Flashcards</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Fredoka', cursive, sans-serif;
            background-color: #F8FAFC;
        }
        .visual-card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .visual-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.1);
        }
        .svg-box svg {
            width: 100%;
            height: 100%;
            display: block;
            filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.06));
        }
    </style>
</head>
<body class="text-slate-800 min-h-screen pb-16">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col items-center gap-3">
            <div class="flex items-center space-x-3">
                <span class="text-3xl">🎨</span>
                <h1 class="text-2xl sm:text-3xl font-bold text-slate-800 text-center">
                    Alphabet Visual Cards
                </h1>
            </div>
            
            <div id="letter-nav" class="flex flex-wrap gap-1.5 justify-center max-w-full overflow-x-auto py-1">
                <!-- Navigation buttons populated dynamically -->
            </div>
        </div>
    </header>

        <div id="cards-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-5">

        let selectedLetter = 'ALL';

        function renderNav() {
            letterNav.innerHTML = letters.map(letter => `
                <button onclick="filterByLetter('${letter}')" class="px-3 py-1.5 text-xs sm:text-sm font-bold rounded-xl transition-all ${
                    selectedLetter === letter 
                        ? 'bg-amber-400 text-slate-900 shadow-md scale-105 ring-2 ring-amber-300' 
                        : 'bg-white text-slate-600 hover:bg-slate-100 border border-slate-200'
                }">
                    ${letter}
                </button>
            `).join('');
        }

        function filterByLetter(letter) {
            selectedLetter = letter;
            renderNav();
            renderCards();
        }

        function renderCards() {
            const filteredItems = selectedLetter === 'ALL' 
                ? itemsData 
                : itemsData.filter(item => item.letter === selectedLetter);

            cardsGrid.innerHTML = filteredItems.map(item => `
                <div class="visual-card bg-white rounded-2xl border border-slate-200 p-4 flex flex-col items-center justify-center text-center shadow-sm">
                    <div class="svg-box w-28 h-28 flex items-center justify-center mb-3">
                        ${item.svg}
                    </div>
                    <span class="text-slate-800 font-bold text-base sm:text-lg capitalize tracking-wide">
                        ${item.name}
                    </span>
                </div>
            `).join('');
        }

        // Initialize application on load
        window.onload = function() {
            renderNav();
            renderCards();
        };
    </script>
